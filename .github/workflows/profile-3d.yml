name: GitHub-Profile-3D-Contrib

on:
  schedule: # 02:00 AM GMT +7 Monday == 19:00 UTC Sunday
    - cron: "0 19 * * 0"
  workflow_dispatch:

concurrency:
  group: profile-3d
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          MAX_REPOS: 300
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add profile-3d-contrib/profile-night-rainbow.svg
          if git diff --staged --quiet; then
            echo "No change in the generated SVG, nothing to commit."
            exit 0
          fi
          git commit -m "generated"
          git pull --rebase --autostash
          git push
